product: "Fallback"
version: 0.1.0-beta.1
description: "Small pay-per-call utilities that resolve uncertainty for autonomous agents. source_route returns ranked candidate access routes, preferably authoritative and machine-readable where possible, within a bounded checked scope. Absence is not proof of nonexistence."
transports:
  http: active
  mcp: active
endpoints:
  mcp: "https://factrail.online/mcp"
  catalog: "https://factrail.online/catalog.json"
  openapi: "https://factrail.online/openapi.json"
  serverCard: "https://factrail.online/.well-known/mcp/server-card.json"
  x402: "https://factrail.online/.well-known/x402.json"
tools:
  - id: source_route
    version: 0.1.0-beta.1
    name: source_route
    status: available
    httpRoute: /v1/tools/source_route
    mcpName: source_route
    priceUsd: "0.02"
    apifyActorId: fallback/source-route
    smitheryServerId: source_route
    glamaServerId: source_route
  - id: stop_search
    version: 0.1.0-beta.1
    name: stop_search
    status: planned
    httpRoute: /v1/tools/stop_search
    mcpName: stop_search
    priceUsd: "0.02"
    apifyActorId: fallback/stop-search
    smitheryServerId: stop_search
    glamaServerId: stop_search
  - id: error_route
    version: 0.1.0-beta.1
    name: error_route
    status: planned
    httpRoute: /v1/tools/error_route
    mcpName: error_route
    priceUsd: "0.002"
    apifyActorId: fallback/error-route
    smitheryServerId: error_route
    glamaServerId: error_route

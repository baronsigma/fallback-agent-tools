product: "Fallback"
version: 0.1.0-beta.1
description: "Fallback gives autonomous agents small, deterministic utilities for the moments where automation gets stuck: finding the right source, diagnosing a failed request, repairing a request from available evidence, and deciding whether another search or paid retrieval is worth the cost."
transports:
  http: active
  mcp: active
endpoints:
  mcp: "https://fallback.factrail.online/mcp"
  catalog: "https://fallback.factrail.online/catalog.json"
  openapi: "https://fallback.factrail.online/openapi.json"
  serverCard: "https://fallback.factrail.online/.well-known/mcp/server-card.json"
  x402: "https://fallback.factrail.online/.well-known/x402.json"
  skill: "https://fallback.factrail.online/skill.md"
tools:
  - id: source_route
    version: 0.1.0-beta.1
    name: source_route
    status: available
    httpRoute: /v1/tools/source_route
    mcpName: source_route
    priceUsd: "0.02"
    apifyActorId: fallback/source-route
    smitheryServerId: source_route
    glamaServerId: source_route
  - id: error_route
    version: 0.1.0-beta.1
    name: error_route
    status: available
    httpRoute: /v1/tools/error_route
    mcpName: error_route
    priceUsd: "0.002"
    apifyActorId: fallback/error-route
    smitheryServerId: error_route
    glamaServerId: error_route
  - id: request_repair
    version: 0.1.0-beta.1
    name: request_repair
    status: available
    httpRoute: /v1/tools/request_repair
    mcpName: request_repair
    priceUsd: "0.005"
    apifyActorId: fallback/request-repair
    smitheryServerId: request_repair
    glamaServerId: request_repair
  - id: stop_search
    version: 0.1.0-beta.1
    name: stop_search
    status: available
    httpRoute: /v1/tools/stop_search
    mcpName: stop_search
    priceUsd: "0.003"
    apifyActorId: fallback/stop-search
    smitheryServerId: stop_search
    glamaServerId: stop_search
